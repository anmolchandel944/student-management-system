<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎓 Student Management System</h1>

<div class="form-box">
    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="roll" placeholder="Roll Number">
    <input type="text" id="course" placeholder="Course">
    <input type="number" id="marks" placeholder="Marks">
    <button onclick="addStudent()">Add Student</button>
</div>

<input type="text" id="search" placeholder="Search student..." onkeyup="searchStudent()">

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Course</th>
            <th>Marks</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="studentList"></tbody>
</table>




 <footer class="footer">
    © 2025 Student Management System | Developed by Anmol Chandel (BCA)
</footer>




<script src="script.js"></script>
</body>
</html>
